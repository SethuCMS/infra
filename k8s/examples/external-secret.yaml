# Not applied by kustomize. Install the External Secrets Operator first (https://external-secrets.io), then apply this by hand.
# It copies the two application secrets from AWS Secrets Manager into the "sethucms-secrets" Secret the pods read.
# The operator needs its own IAM role (IRSA) that can read only the secrets under sethucms/<env>/app/.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws
  namespace: sethucms
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader   # a ServiceAccount annotated with the operator's IAM role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sethucms-secrets
  namespace: sethucms
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: sethucms-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sethucms/staging/app/database-url     # use sethucms/production/app/... in production
    - secretKey: SESSION_SECRET
      remoteRef:
        key: sethucms/staging/app/session-secret
