apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels: { app.kubernetes.io/name: admin }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: admin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admin }
    spec:
      serviceAccountName: admin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # the "nginx" user in the unprivileged nginx image
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin
          image: ghcr.io/sethucms/admin:0.0.0   # overlays pin the real tag, ideally a digest
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: cache
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  labels: { app.kubernetes.io/name: admin }
spec:
  selector: { app.kubernetes.io/name: admin }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: admin }
