# One identity per service, so cloud permissions can be separated:
#   worker  may use the KMS key that protects connection secrets (the only service that decrypts them)
#   api     may send jobs to the queue, and may NOT touch the KMS key
# Overlays add the cloud role annotation (for example eks.amazonaws.com/role-arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
automountServiceAccountToken: false
