# Serves the admin UI. The UI is static; it talks only to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Hashed build files never change, so they can be cached for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths show the app, which decides what to render.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }
}
